# iOS 프로젝트가 컴파일되는지 확인한다(서명 없이 시뮬레이터용으로 빌드). 스토어에 올릴 파일은 만들지 않는다. 올리는 것은 맥의 Xcode에서 Archive로 한다.
# macOS 실행기는 비공개 저장소에서 분당 요금이 10배로 계산되므로, ios 폴더가 바뀔 때와 수동 실행 때만 돈다.
name: iOS build check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for simulator (no signing)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | grep -E "error|warning: unable|BUILD|Resolved|Compiling Capacitor|\*\*" | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
