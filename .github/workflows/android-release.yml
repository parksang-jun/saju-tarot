# 안드로이드 빌드. main에 올릴 때마다, 또는 Actions 탭에서 수동으로 실행한다.
# - 항상: 기기 테스트용 app-debug.apk
# - 서명 시크릿이 있으면: 플레이 콘솔에 올릴 서명된 app-release.aab
# 필요한 저장소 시크릿: ANDROID_KEYSTORE_BASE64 (base64 -i upload-keystore.jks 결과), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'scripts/build.mjs', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android-release.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
      - name: Build signed bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Note when signing secrets are missing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::서명 시크릿이 없어 app-release.aab는 만들지 않았습니다. 디버그 APK만 올렸습니다."
